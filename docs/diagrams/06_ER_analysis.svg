<text x="20" y="1425.0" font-family="Arial" font-size="16">Сплошная связь — идентифицирующая; пунктир — неидентифицирующая.</text>
<rect x="18" y="1430.0" width="628.984375" height="21" fill="white" />
<text x="20" y="1446.0" font-family="Arial" font-size="16">Точка у потомка: 0..N; Z — 0..1; P — 1..N. Ромб у родителя — необязательная связь.</text>
<rect x="18" y="1451.0" width="658.96875" height="21" fill="white" />
<text x="20" y="1467.0" font-family="Arial" font-size="16">UQ — ограничение уникальности с допустимым NULL; это не альтернативный ключ AK.</text>
