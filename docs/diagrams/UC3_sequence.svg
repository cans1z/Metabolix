<text x="85.5" y="65.0" font-family="Arial" font-size="20">Экран «Прогресс»</text>
<text x="786.5" y="65.0" font-family="Arial" font-size="20">Сервис прогресса</text>
<text x="1129.0" y="65.0" font-family="Arial" font-size="20">Хранилище данных</text>
<rect x="239.5" y="137.0" width="211.0" height="24" fill="white" />
<rect x="30" y="229.5" width="25.0" height="25" fill="white" />
<text x="32" y="249.5" font-family="Arial" font-size="20">alt</text>
<rect x="103" y="233.0" width="409.0" height="23" fill="white" />
<text x="105" y="251.0" font-family="Arial" font-size="18">[неверный формат или недопустимое значение]</text>
<rect x="230.5" y="282.0" width="229.0" height="24" fill="white" />
<text x="232.5" y="301.0" font-family="Arial" font-size="19">2. Вернуть ошибку ввода</text>
<rect x="43" y="380.0" width="188.0" height="25" fill="white" />
<text x="45" y="400.0" font-family="Arial" font-size="20">[данные корректны]</text>
<rect x="609.5" y="407.0" width="171.0" height="24" fill="white" />
<rect x="899.0" y="497.0" width="292.0" height="24" fill="white" />
<rect x="942.5" y="570.0" width="205.0" height="24" fill="white" />
<text x="944.5" y="589.0" font-family="Arial" font-size="19">5. Предыдущий замер</text>
<rect x="957.0" y="594.0" width="176.0" height="24" fill="white" />
<text x="959.0" y="613.0" font-family="Arial" font-size="19">или его отсутствие</text>
<rect x="905.0078125" y="665.0" width="279.984375" height="24" fill="white" />
<rect x="906.0" y="689.0" width="278.0" height="24" fill="white" />
<rect x="958.5" y="757.0" width="173.0" height="24" fill="white" />
<text x="960.5" y="776.0" font-family="Arial" font-size="19">7. Замер сохранён</text>
<rect x="927.0" y="835.0" width="236.0" height="24" fill="white" />
<text x="929.0" y="854.0" font-family="Arial" font-size="19">8. Получить замеры, рост</text>
<rect x="918.5" y="859.0" width="253.0" height="24" fill="white" />
<text x="920.5" y="878.0" font-family="Arial" font-size="19">и сводку питания за период</text>
<rect x="936.0" y="915.0" width="218.0" height="24" fill="white" />
<text x="938.0" y="934.0" font-family="Arial" font-size="19">9. Данные для графика,</text>
<rect x="981.0" y="939.0" width="128.0" height="24" fill="white" />
<text x="983.0" y="958.0" font-family="Arial" font-size="19">ИМТ и сводки</text>
<rect x="725" y="1029.5" width="25.0" height="25" fill="white" />
<text x="727" y="1049.5" font-family="Arial" font-size="20">alt</text>
<rect x="798" y="1033.0" width="318.0" height="23" fill="white" />
<text x="800" y="1051.0" font-family="Arial" font-size="18">[замеры минимум за три дня из семи]</text>
<rect x="898" y="1083.0" width="279.0" height="24" fill="white" />
<text x="900" y="1102.0" font-family="Arial" font-size="19">Рассчитать среднее за 7 дней</text>
<rect x="798" y="1205.0" width="282.0" height="24" fill="white" />
<text x="800" y="1224.0" font-family="Arial" font-size="19">[замеры менее чем за три дня]</text>
<rect x="898" y="1245.0" width="231.0" height="24" fill="white" />
<text x="900" y="1264.0" font-family="Arial" font-size="19">Подготовить сообщение:</text>
<rect x="898" y="1269.0" width="353.0" height="24" fill="white" />
<text x="900" y="1288.0" font-family="Arial" font-size="19">«Недостаточно данных для среднего»</text>
<rect x="579.5234375" y="1395.0" width="230.953125" height="24" fill="white" />
<text x="581.5234375" y="1414.0" font-family="Arial" font-size="19">10. График, ИМТ, сводка,</text>
<rect x="582.0" y="1419.0" width="226.0" height="24" fill="white" />
<text x="584.0" y="1438.0" font-family="Arial" font-size="19">среднее или сообщение</text>
<rect x="241.515625" y="1485.0" width="206.96875" height="24" fill="white" />
<rect x="237.0" y="1509.0" width="216.0" height="24" fill="white" />
<rect x="30" y="1604.5" width="32.0" height="25" fill="white" />
<text x="32" y="1624.5" font-family="Arial" font-size="20">opt</text>
<rect x="103" y="1608.0" width="367.0" height="23" fill="white" />
<text x="105" y="1626.0" font-family="Arial" font-size="18">[пользователь заполняет «Самочувствие»]</text>
<rect x="209.5" y="1655.0" width="271.0" height="24" fill="white" />
<rect x="192.5" y="1679.0" width="305.0" height="24" fill="white" />
<rect x="562.5" y="1747.0" width="265.0" height="24" fill="white" />
<text x="564.5" y="1766.0" font-family="Arial" font-size="19">13. Сохранить самочувствие</text>
<rect x="948.5" y="1827.0" width="193.0" height="24" fill="white" />
<text x="950.5" y="1846.0" font-family="Arial" font-size="19">14. Записать данные</text>
<rect x="944.5" y="1907.0" width="201.0" height="24" fill="white" />
<text x="946.5" y="1926.0" font-family="Arial" font-size="19">15. Запись сохранена</text>
<rect x="574.515625" y="1987.0" width="240.96875" height="24" fill="white" />
<text x="576.515625" y="2006.0" font-family="Arial" font-size="19">16. Результат сохранения</text>
<rect x="211.5" y="2067.0" width="267.0" height="24" fill="white" />
<text x="213.5" y="2086.0" font-family="Arial" font-size="19">17. Подтвердить сохранение</text>
<text x="520.0" y="53.5" font-family="Arial" font-size="20.0" text-anchor="middle">Контроллер и сервис</text><text x="520.0" y="77.5" font-family="Arial" font-size="20.0" text-anchor="middle">синхронизации</text><text x="345.0" y="145.0" font-family="Arial" font-size="19.0" text-anchor="middle">1. POST /sync:</text><text x="345.0" y="168.0" font-family="Arial" font-size="19.0" text-anchor="middle">операция, вес и дата</text><text x="695.0" y="426.5" font-family="Arial" font-size="19.0" text-anchor="middle">3. Применить новую операцию</text><text x="1045.0" y="505.0" font-family="Arial" font-size="19.0" text-anchor="middle">4. Получить последний замер</text><text x="1045.0" y="528.0" font-family="Arial" font-size="19.0" text-anchor="middle">предыдущего дня</text><text x="1045.0" y="685.0" font-family="Arial" font-size="19.0" text-anchor="middle">6. Сохранить замер и отметку</text><text x="1045.0" y="708.0" font-family="Arial" font-size="19.0" text-anchor="middle">при изменении более 5 %</text><text x="345.0" y="1505.0" font-family="Arial" font-size="19.0" text-anchor="middle">11. Результат операции</text><text x="345.0" y="1528.0" font-family="Arial" font-size="19.0" text-anchor="middle">и обновлённый прогресс</text><text x="345.0" y="1675.0" font-family="Arial" font-size="19.0" text-anchor="middle">12. POST /sync:</text><text x="345.0" y="1698.0" font-family="Arial" font-size="19.0" text-anchor="middle">операция, дата и факторы</text></svg>