<text x="439.0078125" y="120.5" font-family="Arial" font-size="21">Открыть раздел «Прогресс»</text>
<text x="434.0" y="343.0" font-family="Arial" font-size="21">Ввести вес и дату измерения</text>
<rect x="668" y="438.0" width="202.0" height="26" fill="white" />
<text x="670" y="459.0" font-family="Arial" font-size="21">Данные корректны?</text>
<text x="115.0" y="457.5" font-family="Arial" font-size="21">Показать ошибку</text>
<text x="64.5" y="483.5" font-family="Arial" font-size="21">и предложить исправление</text>
<rect x="393" y="425.0" width="46.984375" height="25" fill="white" />
<text x="395" y="445.0" font-family="Arial" font-size="20">[нет]</text>
<rect x="598" y="505.0" width="39.0" height="25" fill="white" />
<text x="600" y="525.0" font-family="Arial" font-size="20">[да]</text>
<rect x="28" y="704.0" width="262.0" height="26" fill="white" />
<rect x="28" y="730.0" width="218.0" height="26" fill="white" />
<text x="891.0078125" y="722.5" font-family="Arial" font-size="21">Добавить отметку</text>
<text x="844.5" y="748.5" font-family="Arial" font-size="21">о возможной ошибке ввода</text>
<rect x="663" y="680.0" width="39.0" height="25" fill="white" />
<text x="665" y="700.0" font-family="Arial" font-size="20">[да]</text>
<rect x="598" y="775.0" width="46.984375" height="25" fill="white" />
<text x="600" y="795.0" font-family="Arial" font-size="20">[нет]</text>
<text x="386.5" y="973.0" font-family="Arial" font-size="21">Получить замеры за последние 7 дней</text>
<rect x="28" y="1074.0" width="214.0" height="26" fill="white" />
<text x="30" y="1095.0" font-family="Arial" font-size="21">Есть замеры хотя бы</text>
<rect x="28" y="1100.0" width="197.0" height="26" fill="white" />
<text x="30" y="1121.0" font-family="Arial" font-size="21">за три разных дня?</text>
<text x="268.5078125" y="1250.0" font-family="Arial" font-size="21">Рассчитать средний вес</text>
<text x="343.0" y="1276.0" font-family="Arial" font-size="21">за 7 дней</text>
<text x="832.0" y="1250.0" font-family="Arial" font-size="21">Показать: «Недостаточно</text>
<text x="848.0" y="1276.0" font-family="Arial" font-size="21">данных для среднего»</text>
<rect x="418" y="1120.0" width="39.0" height="25" fill="white" />
<text x="420" y="1140.0" font-family="Arial" font-size="20">[да]</text>
<rect x="733" y="1120.0" width="46.984375" height="25" fill="white" />
<text x="735" y="1140.0" font-family="Arial" font-size="20">[нет]</text>
<text x="411.5" y="1494.5" font-family="Arial" font-size="21">Обновить график замеров и ИМТ;</text>
<text x="457.5" y="1520.5" font-family="Arial" font-size="21">показать сводку питания</text>
<text x="471.0" y="1546.5" font-family="Arial" font-size="21">за выбранный период</text>
<rect x="28" y="1644.0" width="252.96875" height="26" fill="white" />
<text x="30" y="1665.0" font-family="Arial" font-size="21">Пользователь открывает</text>
<rect x="28" y="1670.0" width="182.0" height="26" fill="white" />
<text x="30" y="1691.0" font-family="Arial" font-size="21">«Самочувствие»?</text>
<text x="836.0" y="1652.0" font-family="Arial" font-size="21">Выбрать дату и факторы</text>
<text x="791.5078125" y="1678.0" font-family="Arial" font-size="21">или «Ничего из перечисленного»;</text>
<text x="872.0" y="1704.0" font-family="Arial" font-size="21">сохранить запись</text>
<rect x="648" y="1625.0" width="39.0" height="25" fill="white" />
<text x="650" y="1645.0" font-family="Arial" font-size="20">[да]</text>
<rect x="598" y="1745.0" width="46.984375" height="25" fill="white" />
<text x="600" y="1765.0" font-family="Arial" font-size="20">[нет]</text>
<text x="580.0" y="591.0" font-family="Arial" font-size="21.0" text-anchor="middle">Сохранить замер локально;</text><text x="580.0" y="616.0" font-family="Arial" font-size="21.0" text-anchor="middle">поставить в очередь синхронизации</text><text x="30.0" y="726.0" font-family="Arial" font-size="21.0" text-anchor="start">Есть замер предыдущего дня</text><text x="30.0" y="751.0" font-family="Arial" font-size="21.0" text-anchor="start">и изменение больше 5 %?</text></svg>