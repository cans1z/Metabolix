<text x="286.0078125" y="115.0" font-family="Arial" font-size="20">Загрузить данные двух недель</text>
<rect x="18" y="219.5" width="190.0" height="23" fill="white" />
<text x="20" y="237.5" font-family="Arial" font-size="18">В каждой неделе есть</text>
<rect x="18" y="242.5" width="150.0" height="23" fill="white" />
<text x="20" y="260.5" font-family="Arial" font-size="18">≥ 3 дня замеров?</text>
<text x="837.0" y="235.0" font-family="Arial" font-size="20">INSUFFICIENT</text>
<text x="798.0" y="260.0" font-family="Arial" font-size="20">Недостаточно замеров</text>
<rect x="498" y="210.0" width="42.0" height="23" fill="white" />
<text x="500" y="228.0" font-family="Arial" font-size="18">[нет]</text>
<rect x="448" y="290.0" width="35.0" height="23" fill="white" />
<text x="450" y="308.0" font-family="Arial" font-size="18">[да]</text>
<rect x="58" y="500.0" width="161.0" height="23" fill="white" />
<text x="831.0078125" y="515.0" font-family="Arial" font-size="20">NO_DEVIATION</text>
<text x="830.5078125" y="540.0" font-family="Arial" font-size="20">Отклонения нет</text>
<rect x="498" y="490.0" width="42.0" height="23" fill="white" />
<text x="500" y="508.0" font-family="Arial" font-size="18">[нет]</text>
<rect x="448" y="590.0" width="35.0" height="23" fill="white" />
<text x="450" y="608.0" font-family="Arial" font-size="18">[да]</text>
<rect x="18" y="700.5" width="200.0" height="23" fill="white" />
<text x="20" y="718.5" font-family="Arial" font-size="18">Предыдущая соседняя</text>
<rect x="18" y="723.5" width="206.0" height="23" fill="white" />
<text x="20" y="741.5" font-family="Arial" font-size="18">проверка тоже выявила</text>
<rect x="18" y="746.5" width="121.0" height="23" fill="white" />
<text x="20" y="764.5" font-family="Arial" font-size="18">превышение?</text>
<text x="857.5" y="725.0" font-family="Arial" font-size="20">OBSERVE</text>
<text x="792.0078125" y="750.0" font-family="Arial" font-size="20">Наблюдать до проверки</text>
<rect x="498" y="700.0" width="42.0" height="23" fill="white" />
<text x="500" y="718.0" font-family="Arial" font-size="18">[нет]</text>
<text x="370.5" y="907.5" font-family="Arial" font-size="20">DIAGNOSED</text>
<text x="246.0" y="932.5" font-family="Arial" font-size="20">Проверить дневник, факторы за 5 дней</text>
<text x="231.5234375" y="957.5" font-family="Arial" font-size="20">и длительность цели; создать объяснение</text>
<rect x="448" y="800.0" width="35.0" height="23" fill="white" />
<text x="450" y="818.0" font-family="Arial" font-size="18">[да]</text>
<text x="286.0" y="1272.5" font-family="Arial" font-size="20">Сохранить статус проверки. При DIAGNOSED</text>
<text x="288.0078125" y="1297.5" font-family="Arial" font-size="20">также сохранить объяснение и уведомление.</text>
<text x="430.0" y="395.5" font-family="Arial" font-size="20.0" text-anchor="middle">Рассчитать средние и отставание</text><text x="60.0" y="518.5" font-family="Arial" font-size="18.0" text-anchor="start">Отставание &gt; 0,2 кг/неделю?</text></svg>