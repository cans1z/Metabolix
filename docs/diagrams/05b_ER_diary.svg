<text x="25" y="1307.0" font-family="Arial" font-size="17">Ограничение XOR: заполнено ровно одно из полей product_id и recipe_id.</text>
<rect x="18" y="1339.0" width="568.0" height="21" fill="white"/>
<text x="20" y="1355.0" font-family="Arial" font-size="16">Сплошная связь — идентифицирующая; пунктир — неидентифицирующая.</text>
