<text x="25" y="1170.0" font-family="Arial" font-size="18">Одноразовый код может существовать до регистрации пользователя.</text>
<rect x="23" y="1175.0" width="743.984375" height="23" fill="white"/>
<text x="25" y="1193.0" font-family="Arial" font-size="18">Журнал хранит обезличенное обозначение пользователя. У этих таблиц нет FK к users.</text>
<rect x="18" y="1239.0" width="568.0" height="21" fill="white"/>
<text x="20" y="1255.0" font-family="Arial" font-size="16">Сплошная связь — идентифицирующая; пунктир — неидентифицирующая.</text>
<rect x="18" y="1260.0" width="628.984375" height="21" fill="white"/>
<text x="20" y="1276.0" font-family="Arial" font-size="16">Точка у потомка: 0..N; Z — 0..1; P — 1..N. Ромб у родителя — необязательная связь.</text>
<rect x="18" y="1281.0" width="658.96875" height="21" fill="white"/>
<text x="20" y="1297.0" font-family="Arial" font-size="16">UQ — ограничение уникальности с допустимым NULL; это не альтернативный ключ AK.</text>
